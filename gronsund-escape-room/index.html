<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A narrated 30-45 minute outdoor escape room for Gronsund on Falster, Denmark. Five stops, five centuries, one word. Runs on a phone.">
<meta name="theme-color" content="#E3E7E3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#071417" media="(prefers-color-scheme: dark)">
<style>
  html,body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>The Grønsund Casket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<style>
/* ── Tokens ─────────────────────────────────────────────────────────────
   Day chart (light) is the base. Night chart redefines tokens only.      */
:root{
  --ground:#E3E7E3; --surface:#F5F6F2; --surface-2:#EAEEE9; --sunk:#D6DCD7;
  --ink:#0F1C1C; --ink-soft:#425657; --ink-faint:#7A8C8B;
  --line:#C7D0CB; --line-strong:#9EADA8;
  --brand:#0E3B3E; --brand-2:#3F7268; --verdigris:#4F8377;
  --flame:#A94B12; --flame-2:#D98A44; --flame-wash:#F0E2D2;
  --good:#2C6B4E; --bad:#8E3320; --on-brand:#F5F6F2; --on-flame:#FFF6EC;
  --shadow:0 1px 0 rgba(15,28,28,.06), 0 10px 30px -18px rgba(15,28,28,.5);
  --font-display:"IM Fell English","Iowan Old Style",Georgia,"Times New Roman",serif;
  --font-sc:"IM Fell English SC","IM Fell English",Georgia,serif;
  --font-body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --rule:1px solid var(--line);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#071417; --surface:#0D2025; --surface-2:#12292F; --sunk:#061114;
    --ink:#E7EEEA; --ink-soft:#9CB2AF; --ink-faint:#688180;
    --line:#1D3940; --line-strong:#31555C;
    --brand:#8CC8BB; --brand-2:#6BAA9D; --verdigris:#4F8377;
    --flame:#E2913F; --flame-2:#B4652A; --flame-wash:#22201A;
    --good:#69C295; --bad:#E0805F; --on-brand:#04100F; --on-flame:#1A1005;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 14px 34px -20px #000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#071417; --surface:#0D2025; --surface-2:#12292F; --sunk:#061114;
  --ink:#E7EEEA; --ink-soft:#9CB2AF; --ink-faint:#688180;
  --line:#1D3940; --line-strong:#31555C;
  --brand:#8CC8BB; --brand-2:#6BAA9D; --verdigris:#4F8377;
  --flame:#E2913F; --flame-2:#B4652A; --flame-wash:#22201A;
  --good:#69C295; --bad:#E0805F; --on-brand:#04100F; --on-flame:#1A1005;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 14px 34px -20px #000;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--font-body); font-size:16px; line-height:1.6;
  -webkit-text-size-adjust:100%; overflow-x:hidden;
}
/* faint chart hatching, both themes */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.55;
  background:
    repeating-linear-gradient(90deg, transparent 0 47px, var(--line) 47px 48px),
    repeating-linear-gradient(0deg, transparent 0 47px, var(--line) 47px 48px);
  -webkit-mask-image:radial-gradient(120% 80% at 50% 0%, #000 10%, transparent 78%);
  mask-image:radial-gradient(120% 80% at 50% 0%, #000 10%, transparent 78%);
}
.wrap{position:relative; z-index:1; max-width:36rem; margin:0 auto; padding:0 18px 132px}

/* ── Header ─────────────────────────────────────────────────────────── */
header.bar{
  position:sticky; top:0; z-index:20; background:var(--ground);
  border-bottom:var(--rule); box-shadow:0 8px 18px -18px rgba(0,0,0,.7);
}
.bar-in{max-width:36rem; margin:0 auto; padding:8px 18px; display:flex; align-items:center; gap:12px}
.mark{font-family:var(--font-sc); font-size:15px; letter-spacing:.06em; color:var(--brand); white-space:nowrap}
.bar-sp{flex:1}
.clock{font-family:var(--font-mono); font-size:13px; font-variant-numeric:tabular-nums; color:var(--ink-soft); letter-spacing:.02em}
.clock.over{color:var(--flame)}
.iconbtn{
  border:var(--rule); background:var(--surface); color:var(--ink-soft);
  width:32px; height:32px; border-radius:2px; font-size:14px; line-height:1;
  display:grid; place-items:center; cursor:pointer; padding:0;
}
.iconbtn:hover{color:var(--ink); border-color:var(--line-strong)}
.splints{display:flex; gap:5px; padding:0 18px 8px; max-width:36rem; margin:0 auto; min-height:0}
.splint{
  font-family:var(--font-display); font-size:17px; line-height:1;
  width:28px; height:30px; display:grid; place-items:center; position:relative;
  border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink-faint);
  clip-path:polygon(0 6%, 100% 0, 96% 100%, 4% 94%);
}
.splint.has{background:var(--flame-wash); border-color:var(--flame); color:var(--flame); font-weight:400}
.splint sub{font-family:var(--font-mono); font-size:8px; position:absolute; right:3px; bottom:1px; opacity:.75}

/* ── Type ───────────────────────────────────────────────────────────── */
.eyebrow{
  font-family:var(--font-sc); font-size:13px; letter-spacing:.12em;
  color:var(--verdigris); margin:0 0 6px;
}
h1{font-family:var(--font-display); font-weight:400; font-size:clamp(2.4rem,11vw,3.4rem); line-height:1.02; margin:.1em 0 .2em; text-wrap:balance; letter-spacing:-.01em}
h2{font-family:var(--font-display); font-weight:400; font-size:clamp(1.7rem,7vw,2.2rem); line-height:1.1; margin:0 0 .35em; text-wrap:balance}
h3{font-family:var(--font-sc); font-weight:400; font-size:1rem; letter-spacing:.09em; margin:0 0 .5em; color:var(--brand)}
p{margin:0 0 1em; max-width:34rem}
.lede{font-size:1.06rem; color:var(--ink-soft)}
.small{font-size:.86rem; color:var(--ink-soft)}
.tiny{font-size:.78rem; color:var(--ink-faint)}
em{font-style:italic}
a{color:var(--flame); text-underline-offset:2px}
hr.chart{border:0; height:4px; margin:26px 0; background:
  linear-gradient(var(--line),var(--line)) 0 0/100% 1px no-repeat,
  linear-gradient(var(--line),var(--line)) 0 3px/100% 1px no-repeat}

/* ── Cards ──────────────────────────────────────────────────────────── */
.card{
  background:var(--surface); border:var(--rule); border-radius:2px;
  padding:18px; margin:0 0 16px; box-shadow:var(--shadow);
}
.card.quiet{background:var(--surface-2); box-shadow:none}
.scroll{
  background:var(--surface-2); border-left:3px solid var(--verdigris);
  padding:14px 16px; margin:0 0 16px; font-family:var(--font-display); font-size:1.08rem; line-height:1.55;
}
.scroll p:last-child{margin-bottom:0}
.hist{border-top:var(--rule); margin-top:14px; padding-top:12px}
.hist p{margin:0; font-size:.88rem; color:var(--ink-soft)}

/* ledger / data */
table.ledger{width:100%; border-collapse:collapse; font-family:var(--font-mono); font-size:.9rem; font-variant-numeric:tabular-nums}
table.ledger td{padding:7px 0; border-bottom:1px dashed var(--line)}
table.ledger td:last-child{text-align:right; white-space:nowrap; color:var(--brand); font-weight:500}
table.ledger tr:last-child td{border-bottom:0}
table.ledger tr.q td{color:var(--flame); font-weight:600}
.tablewrap{overflow-x:auto}

.verse{font-family:var(--font-display); font-size:1.1rem; line-height:1.75}
.verse span{display:block}
.notice{font-family:var(--font-display); font-size:1.06rem; line-height:1.8; letter-spacing:.005em}

ul.clues{list-style:none; margin:0; padding:0; counter-reset:c}
ul.clues li{
  counter-increment:c; position:relative; padding:0 0 10px 30px; margin:0;
  font-size:.95rem; border-bottom:1px dashed var(--line);
}
ul.clues li:last-child{border-bottom:0; padding-bottom:0}
ul.clues li+li{padding-top:10px}
ul.clues li::before{
  content:counter(c); position:absolute; left:0; top:.15em;
  font-family:var(--font-mono); font-size:.72rem; color:var(--flame);
  border:1px solid var(--flame); width:18px; height:18px; display:grid; place-items:center; border-radius:50%;
}
ul.plain{margin:0 0 1em; padding-left:1.1em}
ul.plain li{margin-bottom:.4em}

/* ── Ice chart (station 2) ──────────────────────────────────────────── */
.chartbox{overflow-x:auto; padding-bottom:4px}
.icegrid{display:grid; grid-template-columns:16px repeat(6,1fr); gap:2px; min-width:288px}
.icegrid .rl,.icegrid .cl{
  font-family:var(--font-mono); font-size:.66rem; color:var(--ink-faint);
  display:grid; place-items:center;
}
.cell{
  position:relative; aspect-ratio:1; border:1px solid var(--line);
  background:var(--surface-2); cursor:pointer; display:grid; place-items:center;
  font-family:var(--font-mono); font-size:.7rem; color:var(--ink-faint); padding:0;
  border-radius:1px; transition:background .12s ease;
}
.cell:hover{border-color:var(--line-strong)}
.cell.feat{background:var(--surface); color:var(--brand); font-weight:600; border-color:var(--line-strong)}
.cell.start{background:var(--flame-wash); border-color:var(--flame); color:var(--flame)}
.cell.on{box-shadow:inset 0 0 0 2px var(--flame)}
.cell .dot{width:7px; height:7px; border-radius:50%; background:var(--flame); position:absolute; right:3px; top:3px; display:none}
.cell.on .dot{display:block}
.legend{margin-top:12px; display:grid; grid-template-columns:1fr 1fr; gap:2px 12px; font-size:.78rem; color:var(--ink-soft)}
.legend b{font-family:var(--font-mono); font-weight:600; color:var(--brand); margin-right:5px}
@media (max-width:400px){.legend{grid-template-columns:1fr}}

/* ── Buttons & input ────────────────────────────────────────────────── */
.btn{
  font-family:var(--font-body); font-size:.95rem; font-weight:600; letter-spacing:.01em;
  padding:13px 18px; border-radius:2px; border:1px solid var(--brand);
  background:var(--brand); color:var(--on-brand); cursor:pointer; width:100%;
  transition:transform .08s ease, filter .15s ease;
}
.btn:active{transform:translateY(1px)}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent; color:var(--ink-soft); border-color:var(--line-strong)}
.btn.ghost:hover{color:var(--ink); border-color:var(--ink-faint); filter:none}
.btn.flame{background:var(--flame); border-color:var(--flame); color:var(--on-flame)}
.btn.sm{padding:9px 12px; font-size:.84rem; width:auto}
.btnrow{display:flex; gap:8px; flex-wrap:wrap}
.btnrow .btn{width:auto; flex:1; min-width:120px}

.answerbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:var(--ground); border-top:var(--rule); padding:10px 18px calc(10px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 24px -20px rgba(0,0,0,.8);
}
.answerbar .in{max-width:36rem; margin:0 auto; display:flex; gap:8px; align-items:stretch}
input[type=text]{
  flex:1; min-width:0; font-family:var(--font-mono); font-size:1rem; letter-spacing:.06em;
  padding:12px 12px; border:1px solid var(--line-strong); border-radius:2px;
  background:var(--surface); color:var(--ink); text-transform:uppercase;
}
input[type=text]::placeholder{color:var(--ink-faint); text-transform:none; letter-spacing:0}
input[type=text]:focus, .btn:focus-visible, .cell:focus-visible, .iconbtn:focus-visible, summary:focus-visible{
  outline:2px solid var(--flame); outline-offset:2px;
}
.dkkeys{display:flex; gap:6px; margin:8px auto 0; max-width:36rem}
.dkkeys button{
  font-family:var(--font-mono); font-size:.85rem; padding:5px 11px; border:var(--rule);
  background:var(--surface-2); color:var(--ink-soft); border-radius:2px; cursor:pointer;
}
.dkkeys button:hover{color:var(--ink)}
.dkkeys .sp{flex:1}
.feedback{font-size:.88rem; margin:8px auto 0; max-width:36rem; min-height:1.2em}
.feedback.no{color:var(--bad)}
.feedback.yes{color:var(--good)}
.shake{animation:shake .35s}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}

details.hint{border:var(--rule); background:var(--surface-2); border-radius:2px; margin:0 0 8px}
details.hint summary{
  cursor:pointer; padding:10px 14px; font-family:var(--font-sc); font-size:.92rem;
  letter-spacing:.06em; color:var(--verdigris); list-style:none;
}
details.hint summary::-webkit-details-marker{display:none}
details.hint summary::after{content:" ▸"; color:var(--ink-faint)}
details.hint[open] summary::after{content:" ▾"}
details.hint .body{padding:0 14px 12px; font-size:.92rem; color:var(--ink-soft)}
details.hint[open] summary{color:var(--flame)}

.field{display:block; margin-bottom:12px}
.field span{display:block; font-family:var(--font-sc); font-size:.85rem; letter-spacing:.07em; color:var(--verdigris); margin-bottom:4px}
.field input{
  width:100%; font-family:var(--font-body); font-size:.95rem; padding:10px;
  border:var(--rule); border-radius:2px; background:var(--surface-2); color:var(--ink);
  text-transform:none; letter-spacing:0;
}
.pill{
  display:inline-block; font-family:var(--font-mono); font-size:.72rem; letter-spacing:.08em;
  padding:3px 8px; border:1px solid var(--line-strong); border-radius:99px; color:var(--ink-soft);
}
.pill.flame{border-color:var(--flame); color:var(--flame)}
.stepline{display:flex; align-items:baseline; gap:10px; margin-bottom:14px; flex-wrap:wrap}
.year{font-family:var(--font-mono); font-size:.8rem; color:var(--flame); letter-spacing:.1em}
.place{font-family:var(--font-sc); font-size:.95rem; letter-spacing:.06em; color:var(--ink-soft)}
.walkicon{font-family:var(--font-display); font-size:2.6rem; color:var(--verdigris); line-height:1; margin-bottom:6px}
.fact{display:grid; grid-template-columns:auto 1fr; gap:6px 10px; font-size:.88rem; align-items:start}
.fact dt{font-family:var(--font-mono); font-size:.7rem; letter-spacing:.06em; padding-top:.28em; white-space:nowrap}
.fact dt.t{color:var(--good)} .fact dt.f{color:var(--flame)}
.fact dd{margin:0; color:var(--ink-soft)}
.center{text-align:center}
.code{
  font-family:var(--font-mono); font-size:2rem; letter-spacing:.3em; color:var(--flame);
  border:1px dashed var(--flame); padding:12px; text-align:center; margin-bottom:14px;
}
/* narrator strip */
.narr{max-width:36rem; margin:0 auto; padding:0 18px 9px; display:flex; gap:9px; align-items:flex-start}
.narr p{
  margin:0; flex:1; font-family:var(--font-display); font-size:.95rem; line-height:1.35;
  color:var(--ink); min-height:2.7em; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.narr p.idle{font-family:var(--font-sc); font-size:.8rem; letter-spacing:.09em; color:var(--ink-faint); min-height:0}
.narr .eq{display:flex; gap:2px; align-items:flex-end; height:13px; flex:none; padding-top:3px}
.narr .eq i{width:2px; height:12px; background:var(--flame); transform-origin:bottom; animation:eq .85s ease-in-out infinite}
.narr .eq i:nth-child(2){animation-delay:.16s} .narr .eq i:nth-child(3){animation-delay:.33s} .narr .eq i:nth-child(4){animation-delay:.08s}
.narr .eq.idle i{animation:none; background:var(--ink-faint); opacity:.5; height:5px}
@keyframes eq{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
.narrbtn{
  flex:none; align-self:flex-start; font-family:var(--font-mono); font-size:.66rem; letter-spacing:.08em;
  padding:3px 7px; border:1px solid var(--line-strong); background:transparent; color:var(--ink-faint);
  border-radius:2px; cursor:pointer;
}
.narrbtn:hover{color:var(--ink); border-color:var(--ink-faint)}
.iconbtn.off{color:var(--ink-faint); opacity:.6}
.iconbtn.on{color:var(--flame); border-color:var(--flame)}
/* maps fallback */
.stop{padding:12px 0; border-bottom:1px dashed var(--line)}
.stop:first-of-type{padding-top:0}
.stop:last-of-type{border-bottom:0; padding-bottom:0}
.stop .field{margin-bottom:8px}
.coordrow{display:flex; gap:8px; align-items:stretch}
.coordrow input{
  flex:1; min-width:0; font-family:var(--font-mono); font-size:.82rem; padding:9px 10px;
  border:var(--rule); border-radius:2px; background:var(--surface-2); color:var(--ink);
  text-transform:none; letter-spacing:0;
}
.coordrow button{flex:none; white-space:nowrap}
.cstat{margin:6px 0 0}
.mapfall{margin:0 0 10px; padding:12px 14px; border:1px dashed var(--line-strong); background:var(--surface-2); border-radius:2px}
.mapfall .q{font-family:var(--font-mono); font-size:.9rem; color:var(--brand); word-break:break-word; -webkit-user-select:all; user-select:all; display:block; margin:6px 0 10px}
select.set{
  width:100%; font-family:var(--font-body); font-size:.92rem; padding:9px 10px; border:var(--rule);
  border-radius:2px; background:var(--surface-2); color:var(--ink);
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

</head>

<script>window.__GRONSUND_AUDIO={"title":{"src":"audio/title.mp3","cues":[{"t":"Listen.","start":0.0,"end":0.325},{"t":"Between the island of Falster, and the islands of Bog\u00f8 and M\u00f8n, there runs a narrow green water.","start":0.845,"end":5.791},{"t":"The old documents call it Gronesund. The green sound.","start":6.071,"end":9.299},{"t":"Kings taxed it. A Swedish army walked across it \u2014 on foot, on the ice.","start":9.719,"end":14.003},{"t":"A ruined noblewoman rowed a ferry over it, and told the greatest playwright in Denmark that she had never in her life been happier.","start":14.263,"end":20.636},{"t":"And on one night in 1872, the sea came back over the top of it.","start":20.996,"end":25.664},{"t":"Somewhere along this shore there is a box.","start":26.184,"end":28.25},{"t":"It has been shut since 1711.","start":28.55,"end":31.07},{"t":"You have forty-five minutes.","start":31.67,"end":33.109}],"dur":33.37},"brief":{"src":"audio/brief.mp3","cues":[{"t":"Summer, 1711.","start":0.0,"end":1.892},{"t":"Plague is loose in Copenhagen, and a young man called Ludvig Holberg is running for his life. South. To the coast. To a ferry house at the edge of the water.","start":2.292,"end":10.57},{"t":"The woman who brings him his supper is called Marie Grubbe.","start":10.91,"end":14.347},{"t":"She was born to one of the great families of Denmark. She was married to the king's own half-brother.","start":14.767,"end":19.515},{"t":"And here she is. In a wet apron. At the end of the world. Telling him she is content.","start":19.755,"end":24.318},{"t":"He wrote about her. He could not stop writing about her.","start":24.738,"end":27.327},{"t":"What he did not write about, was the casket.","start":27.667,"end":30.001},{"t":"She cut one word across five splinters of its lid, and gave them to the sound.","start":30.561,"end":34.671},{"t":"Five stops. Five splinters. Each one carries a letter \u2014 and the letter's place in the word.","start":34.931,"end":39.714},{"t":"Gather all five, and whatever is inside is yours.","start":40.014,"end":42.998},{"t":"Off you go.","start":43.418,"end":44.347}],"dur":44.61},"assemble":{"src":"audio/assemble.mp3","cues":[{"t":"Five splinters.","start":0.0,"end":1.08},{"t":"The sound gave them up in its own order, not yours. But each one is numbered. Each one knows its place.","start":1.56,"end":6.831},{"t":"One word. Five letters. Danish.","start":7.231,"end":9.425},{"t":"Say it out loud at the water.","start":9.985,"end":11.947}],"dur":12.21},"finale":{"src":"audio/finale.mp3","cues":[{"t":"Skrin.","start":0.0,"end":0.72},{"t":"It is the Danish for a small chest.","start":1.34,"end":3.209},{"t":"The lid comes up.","start":3.549,"end":4.629},{"t":"And there is no gold in it.","start":5.429,"end":6.857},{"t":"There was never going to be gold in it.","start":7.277,"end":9.03},{"t":"There is a bundle of letters, in a hand that had been taught to write like a nobleman's daughter \u2014 because it was one.","start":9.65,"end":14.898},{"t":"There is a paper granting the right to row people across Gr\u00f8nsund, and to keep an inn on the Falster shore.","start":15.278,"end":20.804},{"t":"The last thing she owned. The only thing she wanted.","start":21.104,"end":23.705},{"t":"And there is one line, written the summer the young playwright came and asked her how she could possibly bear it.","start":24.265,"end":29.605},{"t":"Jeg har det bedre nu.","start":30.225,"end":32.454},{"t":"I am better off now.","start":33.154,"end":34.362},{"t":"She died here in 1718.","start":35.162,"end":37.577},{"t":"Holberg never got over it. Neither, frankly, did Denmark.","start":37.917,"end":41.678},{"t":"You may go.","start":42.238,"end":43.063}],"dur":43.32},"walk1":{"src":"audio/walk1.mp3","cues":[{"t":"First stop. The water's edge, where the ferry came in.","start":0.0,"end":2.972},{"t":"Stand where you can see across, and think about money.","start":3.252,"end":5.806},{"t":"Everything that ever crossed here \u2014 every ox, every barrel, every man on foot \u2014 was worth a number to somebody.","start":6.106,"end":12.979}],"dur":13.24},"station1":{"src":"audio/station1.mp3","cues":[{"t":"The green sound. It is in the written record as early as the 1180s.","start":0.0,"end":3.994},{"t":"And by the 1230s the king's clerks are here with their books \u2014 because a crossing is a chokepoint, and a chokepoint is money.","start":4.234,"end":10.619},{"t":"Someone has scratched a note into the margin of the toll board. And the salt has eaten the fourth line.","start":11.019,"end":15.896},{"t":"Read the board. Find the sum.","start":16.356,"end":18.097}],"dur":18.36},"solved1":{"src":"audio/solved1.mp3","cues":[{"t":"Thirty-five.","start":0.0,"end":0.94},{"t":"An ox is six, a barrel is four, and a man is one \u2014 a man being, as ever, the cheapest thing on the list.","start":1.34,"end":8.005},{"t":"Something comes away from the board in your hand. A splinter of oak, with a letter cut into it.","start":8.425,"end":13.173}],"dur":13.43},"walk2":{"src":"audio/walk2.mp3","cues":[{"t":"Second stop. Now look at that water.","start":0.0,"end":1.939},{"t":"And imagine it solid.","start":2.239,"end":3.748},{"t":"Imagine an army walking on it.","start":4.268,"end":6.439}],"dur":6.7},"station2":{"src":"audio/station2.mp3","cues":[{"t":"The winter the sea turned to stone.","start":0.0,"end":1.8},{"t":"January, 1658. Karl the Tenth Gustav walks his army across the frozen Little Belt. Seven thousand men. On ice. Over open sea.","start":2.32,"end":10.888},{"t":"And he keeps going. Langeland. Lolland. Falster.","start":11.148,"end":14.201},{"t":"Out there, a warship sits frozen into the sound like a fly in amber, and it will not move again until spring.","start":14.621,"end":20.577},{"t":"But the ice is not honest. It is a foot thick here, and rotten twenty paces that way.","start":20.917,"end":25.062},{"t":"The only men who know the difference are the men who fish it. And one of them left directions.","start":25.322,"end":29.281},{"t":"No names. Only steps.","start":29.681,"end":31.585}],"dur":31.84},"solved2":{"src":"audio/solved2.mp3","cues":[{"t":"B, four. The mill on the rise.","start":0.0,"end":2.101},{"t":"Of course it is. It is the one thing you can see from out on that ice in any weather.","start":2.481,"end":6.545},{"t":"Second splinter.","start":6.885,"end":7.93}],"dur":8.19},"walk3":{"src":"audio/walk3.mp3","cues":[{"t":"Third stop. The ferry house.","start":0.0,"end":1.649},{"t":"This is the one with a body in it.","start":2.169,"end":4.235}],"dur":4.5},"station3":{"src":"audio/station3.mp3","cues":[{"t":"Now.","start":0.0,"end":0.43},{"t":"Marie Grubbe.","start":1.03,"end":2.121},{"t":"Married at seventeen to Ulrik Frederik Gyldenl\u00f8ve \u2014 the king's half-brother, the finest match in the kingdom.","start":2.741,"end":8.766},{"t":"Divorced. Married again. Ruined.","start":9.046,"end":11.183},{"t":"And then, at the bottom of that very long fall, she marries a man twenty years younger than herself, and comes here \u2014 to row strangers across a cold strait for coppers.","start":11.643,"end":20.594},{"t":"And when Holberg asks her, with the beautiful rudeness of the young, how she can possibly bear it \u2014","start":20.974,"end":25.792},{"t":"she tells him she is happier now.","start":26.192,"end":28.131},{"t":"The nineteenth of May, 1711. A drinking party at the ferry house goes wrong.","start":28.751,"end":33.407},{"t":"Her husband picks up a gun. And a skipper from Drag\u00f8r does not go home.","start":33.667,"end":37.66},{"t":"In the hour before the bailiff arrives, a casket leaves that house. Four people watched it go.","start":38.18,"end":42.813},{"t":"And the parish clerk, who knew this village extremely well, wrote in the margin:","start":43.153,"end":47.205},{"t":"exactly one of them is telling the truth.","start":47.605,"end":49.962}],"dur":50.22},"solved3":{"src":"audio/solved3.mp3","cues":[{"t":"The loft.","start":0.0,"end":0.662},{"t":"Only the tollman told the truth \u2014 and even he only told you what did not happen.","start":1.142,"end":5.043},{"t":"That, right there, is a village. Third splinter.","start":5.443,"end":8.438}],"dur":8.7},"walk4":{"src":"audio/walk4.mp3","cues":[{"t":"Fourth stop. Get yourself some height, if this island has any to offer.","start":0.0,"end":3.692},{"t":"You want to be standing where a fire would be seen for miles.","start":3.952,"end":6.889}],"dur":7.15},"station4":{"src":"audio/station4.mp3","cues":[{"t":"1813. Denmark is at war with Britain.","start":0.0,"end":2.949},{"t":"The whole coast is watched. On every headland there are men sitting up all night beside a heap of tar and brushwood, waiting to set it alight.","start":3.229,"end":10.462},{"t":"One fire lights the next. The country can be told in an hour.","start":10.742,"end":14.341},{"t":"And in the middle of all this, the Postmaster General sits down \u2014 and issues a price list.","start":14.801,"end":19.375},{"t":"Because of course he does.","start":19.795,"end":21.537},{"t":"But look at the top of this copy. Somebody else has written on it. In a different hand.","start":22.097,"end":26.543}],"dur":26.8},"solved4":{"src":"audio/solved4.mp3","cues":[{"t":"Every fifth word. The fire is lit at Bavnen.","start":0.0,"end":2.74},{"t":"Three place names sitting in plain sight to waste your time, and the real one buried in the grammar.","start":3.14,"end":8.132},{"t":"Fourth splinter.","start":8.472,"end":9.529}],"dur":9.79},"walk5":{"src":"audio/walk5.mp3","cues":[{"t":"Last stop. Down to the dike. Or the shore. Somewhere you can see how high the water is today.","start":0.0,"end":4.818},{"t":"Because you are about to find out how high it got.","start":5.198,"end":7.659}],"dur":7.92},"station5":{"src":"audio/station5.mp3","cues":[{"t":"The thirteenth of November, 1872.","start":0.0,"end":2.961},{"t":"The wind comes round, and it does not stop. Thirty-two metres a second \u2014 a hurricane, over Lolland, Falster and M\u00f8n.","start":3.481,"end":10.098},{"t":"It pushes the Baltic west. And west. And the water climbs three metres above anything a living person has ever seen.","start":10.378,"end":16.88},{"t":"It comes over the fields in the dark. Close to a hundred people drown on land. Two hundred ships are broken open.","start":17.22,"end":23.721},{"t":"Afterwards, the parish clerk wrote five lines about it.","start":24.241,"end":27.109},{"t":"They are terrible verse. And they are not about the flood.","start":27.509,"end":30.052}],"dur":30.31},"solved5":{"src":"audio/solved5.mp3","cues":[{"t":"Diget. The dike.","start":0.0,"end":1.045},{"t":"They read the water, and then they built against it. And it is still standing. And it is the only reason you are standing dry.","start":1.465,"end":7.792},{"t":"That is five.","start":8.212,"end":9.141}],"dur":9.4}};</script>

  var at = t.match(/@(-?\d{1,3}(?:\.\d+)?),\s*(-?\d{1,3}(?:\.\d+)?)/);
  var m = at || t.match(/(-?\d{1,3}(?:\.\d+)?)[,\s]+(-?\d{1,3}(?:\.\d+)?)/);

/* ── The Narrator ────────────────────────────────────────────────────────
   Web Speech API. No network, no assets. Each line has a caption (t) and,
   where Danish would defeat an English voice, a phonetic spoken form (s).
   r = rate multiplier, p = pitch, g = silence after, in ms.              */

var SPEAKABLE = (typeof window !== "undefined") && ("speechSynthesis" in window) && ("SpeechSynthesisUtterance" in window);
/* Recorded narration, injected by the build. Absent = fall back to the
   device's own voice, which is what shipped before and still works. */
var AUDIO = (typeof window !== "undefined" && window.__GRONSUND_AUDIO) || null;
function hasVoice(){ return !!AUDIO || SPEAKABLE; }
function usingRecording(){ return !!AUDIO && !V.useTTS; }

var V = { on:true, fx:true, rate:0.95, uri:null, useTTS:false, gen:0, live:false, last:null, lastKey:null };
try{ var vs_ = JSON.parse(localStorage.getItem(KEY+"-voice"));
     if(vs_){ V.on=!!vs_.on; V.fx=vs_.fx!==false; V.rate=vs_.rate||0.95; V.uri=vs_.uri||null; V.useTTS=!!vs_.useTTS; } }catch(e){}
function saveVoice(){ try{ localStorage.setItem(KEY+"-voice", JSON.stringify(
  {on:V.on,fx:V.fx,rate:V.rate,uri:V.uri,useTTS:V.useTTS})); }catch(e){} }

function voices(){ try{ return window.speechSynthesis.getVoices() || []; }catch(e){ return []; } }
function pickVoice(){
  var vs = voices(); if(!vs.length) return null;
  var i;
  if(V.uri){ for(i=0;i<vs.length;i++){ if(vs[i].voiceURI===V.uri) return vs[i]; } }
  for(i=0;i<vs.length;i++){ if(/^en[-_]GB/i.test(vs[i].lang) && !/google/i.test(vs[i].name)) return vs[i]; }
  for(i=0;i<vs.length;i++){ if(/^en[-_]GB/i.test(vs[i].lang)) return vs[i]; }
  for(i=0;i<vs.length;i++){ if(/^en/i.test(vs[i].lang)) return vs[i]; }
  return vs[0];
}
if(SPEAKABLE){ try{ window.speechSynthesis.onvoiceschanged = function(){ if(S.screen==="host") render(); }; }catch(e){} }

/* long lines are split at sentence ends: some engines truncate past ~15s */
function sentences(txt){
  var m = String(txt).match(/[^.!?]+[.!?]*\s*/g);
  if(!m) return [txt];
  var out = [], i, x;
  for(i=0;i<m.length;i++){ x = m[i].replace(/^\s+|\s+$/g,""); if(x) out.push(x); }
  return out.length ? out : [txt];
}
function chunk(lines){
  var out = [], i, j;

    if(txt.length <= 190){ out.push(L); continue; }
    var parts = sentences(txt), cap = sentences(L.t);
    for(j=0;j<parts.length;j++){
      out.push({ t: cap[j] || L.t, s: parts[j], r:L.r, p:L.p, g: (j===parts.length-1 ? L.g : 120) });
    }
  }
  return out;
}

var AUD = null;
function stopSpeech(){
  V.gen++; V.live = false;
  if(SPEAKABLE){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  if(AUD){ try{ AUD.pause(); AUD.src = ""; }catch(e){} AUD = null; }
  paintNarr();
}
function narrate(lines, key){
  stopSpeech();
  V.last = lines; V.lastKey = key || null;
  if(!V.on || !lines || !lines.length){ paintNarr(); return; }
  if(usingRecording() && key && AUDIO[key]){ playRecording(key, lines); return; }
  speakLines(lines);
}

/* One file per screen, with the authored pauses baked in. The cue list maps
   playback time back to the line, so the caption tracks the voice. */
function playRecording(key, lines){
  var track = AUDIO[key], g = ++V.gen, cues = track.cues || [], shown = -2;
  V.live = true; paintNarr(cues.length ? cues[0].t : "");
  try{ AUD = new Audio(track.src); }catch(e){ AUD = null; }
  if(!AUD){ speakLines(lines); return; }
  AUD.preload = "auto";
  function bail(){ if(g !== V.gen) return; AUD = null; speakLines(lines); }
  AUD.ontimeupdate = function(){
    if(g !== V.gen) return;
    var t = AUD.currentTime, k = -1, j;
    for(j=0;j<cues.length;j++){ if(t >= cues[j].start - 0.06){ k = j; } else { break; } }
    if(k !== shown){ shown = k; paintNarr(k >= 0 ? cues[k].t : ""); }
  };
  AUD.onended = function(){ if(g !== V.gen) return; V.live = false; AUD = null; paintNarr(); };
  AUD.onerror = bail;
  var pr;
  try{ pr = AUD.play(); }catch(e){ bail(); return; }
  if(pr && pr.catch){ pr.catch(bail); }
}

function speakLines(lines){
  if(!SPEAKABLE || !lines || !lines.length){ V.live = false; paintNarr(); return; }
  var q = chunk(lines), g = ++V.gen, k = 0;
  V.live = true; paintNarr();
  function step(){
    if(g !== V.gen) return;
    if(k >= q.length){ V.live = false; paintNarr(); return; }
    var L = q[k];
    paintNarr(L.t);
    var u = new SpeechSynthesisUtterance(L.s || L.t);
    var voice = pickVoice(); if(voice) u.voice = voice;
    u.lang = (voice && voice.lang) || "en-GB";
    u.rate = Math.max(0.5, Math.min(1.6, (L.r || 1) * V.rate));
    u.pitch = L.p || 0.96;
    u.onend = function(){ if(g!==V.gen) return; k++; setTimeout(step, L.g == null ? 260 : L.g); };
    u.onerror = function(){ if(g!==V.gen) return; k++; setTimeout(step, 120); };
    try{ window.speechSynthesis.speak(u); }
    catch(e){ k++; setTimeout(step, 60); }
  }
  step();
}

function paintNarr(caption){
  var n = el("narr"); if(!n) return;
  if(!V.on || !hasVoice() || S.screen==="host"){ n.hidden = true; n.innerHTML = ""; return; }
  n.hidden = false;
  if(V.live){
    n.innerHTML = '<span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>'
      + '<p>' + esc(caption || "…") + '</p>'
      + '<button class="narrbtn" id="narrStop" aria-label="Stop the narrator">stop</button>';
    el("narrStop").onclick = function(){ stopSpeech(); };
  } else {
    n.innerHTML = '<span class="eq idle" aria-hidden="true"><i></i><i></i><i></i><i></i></span>'
      + '<p class="idle">Narrator on</p>'
      + '<button class="narrbtn" id="narrAgain" aria-label="Play the narration again">replay</button>';

/* ── Sound cues, synthesised ─────────────────────────────────────────── */
var AC = null;
function ac(){
  if(!V.fx) return null;
  try{
    if(!AC){ var C = window.AudioContext || window.webkitAudioContext; if(!C) return null; AC = new C(); }
    if(AC.state === "suspended"){ AC.resume(); }
    return AC;
  }catch(e){ return null; }
}
function tone(c,at,f,dur,type,g){
  var o=c.createOscillator(), gn=c.createGain();

  gn.gain.setValueAtTime(0.0001,at);
  gn.gain.exponentialRampToValueAtTime(g||0.09,at+0.02);
  gn.gain.exponentialRampToValueAtTime(0.0001,at+dur);
  o.connect(gn); gn.connect(c.destination); o.start(at); o.stop(at+dur+0.05);
}
function noise(c,at,dur,f,g,sweepTo){
  var n=Math.max(1,Math.floor(c.sampleRate*dur)), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0), i;
  for(i=0;i<n;i++){ d[i]=(Math.random()*2-1)*(1-i/n); }
  var s=c.createBufferSource(); s.buffer=b;
  var flt=c.createBiquadFilter(); flt.type="lowpass";
  flt.frequency.setValueAtTime(f,at);
  if(sweepTo){ flt.frequency.linearRampToValueAtTime(sweepTo,at+dur); }
  var gn=c.createGain(); gn.gain.setValueAtTime(g,at); gn.gain.exponentialRampToValueAtTime(0.0001,at+dur);
  s.connect(flt); flt.connect(gn); gn.connect(c.destination); s.start(at); s.stop(at+dur);
}
function cue(kind){
  var c = ac(); if(!c) return; var t = c.currentTime + 0.01;
  if(kind==="found"){                      /* oak splits, a bell answers */
    noise(c,t,0.10,900,0.32,300);
    tone(c,t+0.05,587.33,0.22,"sine",0.07);
    tone(c,t+0.16,880,0.55,"sine",0.06);
  } else if(kind==="wrong"){               /* a dull knock on a shut lid */
    noise(c,t,0.09,220,0.22,90);
    tone(c,t,98,0.16,"triangle",0.05);
  } else if(kind==="open"){                /* the hinge gives, then light */
    noise(c,t,0.55,240,0.16,1400);
    tone(c,t+0.50,392,1.1,"sine",0.07);
    tone(c,t+0.66,523.25,1.3,"sine",0.06);
    tone(c,t+0.86,784,1.6,"sine",0.05);
  }
}

/* Artifact and in-app browsers often block window.open. Detect it and hand
   the player something they can use by hand instead of a dead button.     */
function copyText(text, btn, label){
  function flash(msg){ btn.textContent = msg; setTimeout(function(){ btn.textContent = label; }, 1800); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ flash("Copied"); }, function(){ flash("Select it below"); });
  } else { flash("Select it below"); }
}
function openMaps(i){
  var url = mapLink(i), q = mapTarget(i), w = null;
  try{ w = window.open(url, "_blank", "noopener"); }catch(e){ w = null; }
  if(w){ try{ w.opener = null; }catch(e){} return; }
  var box = el("mapFall"); if(!box) return;
  var isCoord = !!coordOf(i);
  box.innerHTML =
    '<div class="mapfall"><p class="small" style="margin:0">This browser will not let the game open another tab. '
    + (isCoord ? 'Paste these coordinates into your maps app — they work in Google Maps, Apple Maps, anything:'
               : 'Search for this in your own maps app:') + '</p>'
    + '<code class="q" id="mapQ">' + esc(q) + '</code>'
    + '<div class="btnrow"><button class="btn ghost sm" id="mapCopy">Copy it</button>'
    + '<a class="btn ghost sm" style="text-align:center;text-decoration:none;line-height:1.5" href="' + url + '">Try the link</a></div></div>';
  el("mapCopy").onclick = function(){
    var btn = el("mapCopy");
    function done(){ btn.textContent = "Copied"; setTimeout(function(){ btn.textContent = "Copy it"; }, 1600); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(q).then(done, select);
    } else { select(); }
    function select(){
      try{
        var r = document.createRange(); r.selectNodeContents(el("mapQ"));
        var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        btn.textContent = "Selected — hold to copy";
        setTimeout(function(){ btn.textContent = "Copy it"; }, 2400);
      }catch(e){}
    }
  };
}

function buildChart(){
  var box = el("chartbox"); if(!box) return;
  var cols = ["A","B","C","D","E","F"], html = '<div class="icegrid">';
  var nums = {}, n = 0, k;
  for(k in FEATURES){ if(k!=="C2"){ n++; nums[k]=n; } }
  for(var r=6;r>=1;r--){
    html += '<span class="rl">'+r+'</span>';
    for(var c=0;c<6;c++){
      var id = cols[c]+r, cls = "cell", lbl = "";
      if(id==="C2"){ cls+=" start"; lbl="★"; }
      else if(FEATURES[id]){ cls+=" feat"; lbl=nums[id]; }
      html += '<button class="'+cls+'" data-id="'+id+'" title="'+id+'"><span>'+lbl+'</span><span class="dot"></span></button>';
    }
  }
  html += '<span></span>';
  for(var c2=0;c2<6;c2++){ html += '<span class="cl">'+cols[c2]+'</span>'; }
  html += '</div>';
  box.innerHTML = html;

  var lg = el("legend"), lh = '<div><b>★</b>Det frosne skib <span class="tiny">(the frozen ship)</span></div>';
  for(k in FEATURES){
    if(k==="C2") continue;
    lh += '<div><b>'+nums[k]+'</b>'+FEATURES[k]+' <span class="tiny">('+FEATURE_EN[FEATURES[k]]+')</span></div>';
  }
  lg.innerHTML = lh;

  Array.prototype.forEach.call(box.querySelectorAll(".cell"), function(b){
    b.onclick = function(){ b.classList.toggle("on"); };
  });
  if(el("clearTrace")) el("clearTrace").onclick = function(){
    Array.prototype.forEach.call(box.querySelectorAll(".cell.on"), function(b){ b.classList.remove("on"); });
  };
}

function screenStation(a, d){

    + '</div>'

       '<div class="dkkeys"><button data-c="Æ">Æ</button><button data-c="Ø">Ø</button><button data-c="Å">Å</button>'
       + '<span class="sp"></span><button data-c="__back">⌫</button></div>')
    + '<div class="feedback" id="fb" role="status" aria-live="polite"></div>'
    + '</div>';

  var input = el("ans"), fb = el("fb");

      input.focus();

  });

  var a = el("app"), d = el("dock");
  d.innerHTML = "";
  cue("found");
  drawSplints();
  a.innerHTML =
    '<p class="eyebrow">Stop '+(i+1)+' · solved</p>'
    + '<h2>'+esc(st.title)+'</h2>'

      + '<li>Load the page once with signal. After that it runs offline and remembers where you are, even if the phone locks.</li>'
      + '<li>One phone per group of 2–6 works better than one each. Read the story parts aloud.</li>'
      + '<li>Step-free throughout if you pick your stops that way; nothing requires bending, digging or climbing.</li>'
      + '<li>The 1711 station involves a killing and the 1872 one a drowning. Both are historical fact, told plainly. Fine for around age 10 up.</li>'
      + '</ul></div>'
    + '<details class="hint"><summary>Answer key — spoilers</summary><div class="body">'
      + '<b>1231</b> 35 · <b>1658</b> Møllen (B4) · <b>1711</b> Loftet · <b>1813</b> Bavnen · <b>1872</b> Diget<br>'
      + 'Letters, in order of position: S·K·R·I·N. Final word <b>SKRIN</b>. Padlock 1711.'
    + '</div></details>'
    + '<div class="btnrow" style="margin-top:16px">'
      + '<button class="btn flame" id="back">Back to the game</button>'
      + '<button class="btn ghost" id="wipe">Erase progress</button>'
    + '</div>';
  Array.prototype.forEach.call(a.querySelectorAll("input[data-r]"), function(inp){
    inp.oninput = function(){
      var n = parseInt(inp.getAttribute("data-r"),10);
      S.route[n].name = inp.value; S.route[n].q = inp.value; save();
    };
  });
  function pinStatus(n, msg){ var e = el("cstat"+n); if(e) e.textContent = msg; }
  Array.prototype.forEach.call(a.querySelectorAll("input[data-c]"), function(inp){
    inp.oninput = function(){
      var n = parseInt(inp.getAttribute("data-c"),10);
      if(!inp.value.trim()){
        delete S.route[n].lat; delete S.route[n].lng; save();
        pinStatus(n, "No pin. The maps button will search for the name instead."); return;
      }
      var c = parseCoords(inp.value);
      if(c){ S.route[n].lat = c.lat; S.route[n].lng = c.lng; save();
             pinStatus(n, "Pinned — the maps button will open this exact point."); }
      else { pinStatus(n, "Not a coordinate yet. Try 54.885831, 12.119331 — or paste a maps link."); }
    };
  });
  Array.prototype.forEach.call(a.querySelectorAll("button[data-gps]"), function(btn){
    btn.onclick = function(){
      var n = parseInt(btn.getAttribute("data-gps"),10);
      if(!navigator.geolocation){
        pinStatus(n, "This browser gives the game no location access. Type the coordinates instead."); return;
      }
      btn.textContent = "Finding you…";
      navigator.geolocation.getCurrentPosition(function(pos){
        S.route[n].lat = pos.coords.latitude; S.route[n].lng = pos.coords.longitude; save();
        var f = a.querySelector('input[data-c="'+n+'"]'); if(f) f.value = coordOf(n);
        btn.textContent = "Use my location";
        pinStatus(n, "Pinned to where you are standing, give or take "
          + Math.round(pos.coords.accuracy || 0) + " m.");
      }, function(err){
        btn.textContent = "Use my location";
        pinStatus(n, err && err.code === 1
          ? "Location refused. Allow it in your browser settings, or type the coordinates."
          : "Could not get a fix — try again outdoors, or type the coordinates.");
      }, {enableHighAccuracy:true, timeout:12000, maximumAge:0});
    };
  });
  el("walkTog").onchange = function(){ S.walking = el("walkTog").checked; save(); };
  if(el("narrTog")) el("narrTog").onchange = function(){ V.on = el("narrTog").checked; saveVoice(); if(!V.on) stopSpeech(); render(); };
  if(el("ttsTog")) el("ttsTog").onchange = function(){ V.useTTS = el("ttsTog").checked; saveVoice(); render(); testVoice(); };
  if(el("fxTog")) el("fxTog").onchange = function(){ V.fx = el("fxTog").checked; saveVoice(); if(V.fx) cue("found"); };
  if(el("voiceSel")) el("voiceSel").onchange = function(){ V.uri = el("voiceSel").value || null; saveVoice(); testVoice(); };
  if(el("rateSel")) el("rateSel").onchange = function(){ V.rate = parseFloat(el("rateSel").value); saveVoice(); testVoice(); };
  if(el("testVoice")) el("testVoice").onclick = testVoice;
  el("resetRoute").onclick = function(){ S.route = JSON.parse(JSON.stringify(DEFAULT_ROUTE)); save(); render(); };
  el("back").onclick = function(){
    S.screen = S.started ? (S.solved.length>=5 ? "assemble" : "walk") : "title"; render();
  };
  el("wipe").onclick = function(){ if(confirm("Erase progress and start over?")) reset(); };
}

function voiceOptions(){
  var vs = voices(), out = '<option value="">Automatic — best English voice on this device</option>', i, v;
  for(i=0;i<vs.length;i++){
    v = vs[i];
    if(!/^en/i.test(v.lang) && !/^da/i.test(v.lang)) continue;
    out += '<option value="' + esc(v.voiceURI) + '"' + (V.uri===v.voiceURI ? " selected" : "") + '>'
        + esc(v.name) + ' (' + esc(v.lang) + ')</option>';
  }
  return out;
}
function testVoice(){
  if(usingRecording() && AUDIO.title){ narrate(SAY.title, "title"); return; }
  narrate([{t:"The green sound. Kings taxed it, and an army walked across it on the ice.", r:.9}]);
}

el("sndBtn").onclick = function(){
  V.on = !V.on; saveVoice();
  el("sndBtn").className = "iconbtn " + (V.on ? "on" : "off");
  el("sndBtn").textContent = V.on ? "🔊" : "🔇";
  if(V.on){ narrate(V.last, V.lastKey); } else { stopSpeech(); }
};

/* stop talking when the phone is pocketed or the player switches app */
document.addEventListener("visibilitychange", function(){ if(document.hidden) stopSpeech(); });
window.addEventListener("pagehide", function(){ stopSpeech(); });

el("menuBtn").onclick = function(){
  if(S.screen==="host"){ S.screen = S.started ? (S.solved.length>=5?"assemble":"walk") : "title"; }
  else { S.screen="host"; }
  render();
};

render();
</script>

</body>
</html>
